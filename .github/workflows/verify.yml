name: Verify skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statechart-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/statechart/scripts/package-lock.json
      - name: Install a clean runtime
        run: ./skills/statechart/scripts/setup-runtime.ps1 -Development
      - name: Check repeated setup
        run: ./skills/statechart/scripts/setup-runtime.ps1 -Development
      - name: Run unit and native Windows tests
        run: npm --prefix ./skills/statechart/scripts test
